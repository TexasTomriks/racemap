# racemap — docker compose convenience wrapper.
#
# 0. On Linux, create ./results yourself first (mkdir -p kernel results):
#    the container runs as uid 1000, not root, and if Docker auto-creates
#    a missing bind-mount directory on first run it does so as root:root,
#    which that user then can't write export/benchmark output into.
# 1. Put (or symlink) your Linux kernel source under ./kernel/
# 2. Build:    docker compose build
# 3. Validate: docker compose run --rm racemap validate
# 4. Scan:     docker compose run --rm racemap scan /kernel/net/ --kernel-version 6.8
# 5. Benchmark (uses the bundled fixtures, no kernel needed):
#              docker compose run --rm --entrypoint python racemap scripts/benchmark.py
# 6. Web UI (the one shown in the demo video):
#              docker compose up web
#              open http://127.0.0.1:5005
#
services:
  racemap:
    build: .
    image: racemap:latest
    container_name: racemap
    volumes:
      # User drops kernel source into ./kernel on the host; container sees /kernel.
      - ./kernel:/kernel:ro
      # Persist JSON reports / benchmark results back to the host.
      - ./results:/app/results
    # Default to showing CLI help; override on the command line, e.g.:
    #   docker compose run --rm racemap scan /kernel/crypto/ --llm heuristic
    command: ["--help"]

  web:
    build: .
    image: racemap:latest
    container_name: racemap-web
    entrypoint: ["python"]
    command: ["web/server.py"]
    environment:
      # Required: binding to 127.0.0.1 *inside the container* would be
      # unreachable from the host despite the port mapping below -- this is
      # about the container's own loopback, not host exposure. The port
      # mapping below is what actually controls host-side exposure, and it
      # stays loopback-only by default: there is no authentication in front
      # of the web UI, and it accepts absolute filesystem paths to scan, so
      # binding it to a routable interface exposes local file contents to
      # anyone who can reach the port.
      - RACEMAP_HOST=0.0.0.0
    ports:
      # Host-side loopback-only. Widen deliberately (e.g. "5005:5005" for
      # all interfaces) only on a network you already trust.
      - "127.0.0.1:5005:5005"
    volumes:
      - ./kernel:/kernel:ro
      - ./results:/app/results
